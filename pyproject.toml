[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-soup-etl"
version = "1.2.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # Pinned to the tested DuckDB minor version: `INSTALL spatial` fetches the extension
    # build matching the running DuckDB core, so this pin is what keeps the spatial
    # extension version reproducible. Bump alongside the version noted in engine.py and
    # README.md when upgrading.
    "duckdb>=1.5.4,<1.6",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "certifi>=2024.2.2",
    "numpy>=1.26.0",
    "pytz>=2024.1",
    "python-multipart>=0.0.9",
    "mgrs>=1.4",
    "pyogrio>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["duck_soup*"]

[tool.setuptools.package-data]
duck_soup = [
    "web/static/*",
    "web/static/assets/*",
    "web/static/maplibre/*",
    "tutorial/*",
]

[project.scripts]
duck-soup = "duck_soup.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
