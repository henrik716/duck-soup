    crs: EPSG:4326
  - id: boardwalks
    format: geojson
    uri: data/tutorial/boardwalks.geojson
    crs: EPSG:4326
  - {id: categories, format: csv, uri: data/tutorial/categories.csv}
  base: places
  steps:
  - type: spatial_join
    source: districts
    fields: {district: district_name}
  mapping:
  - {to: name, from: name}
  - {to: dataset, const: "Pondsworth open data"}
  - {to: name_upper, expr: "upper(name)"}
  - to: size
    expr: |-
      CASE
        WHEN bread_crumbs >= 50000 THEN 'large'
        WHEN bread_crumbs >= 15000 THEN 'medium'
        WHEN bread_crumbs IS NULL THEN 'unknown'
        ELSE 'small'
      END
  - {to: label, expr: "name || ' (' || coalesce(district, 'outside town') || ')'"}
