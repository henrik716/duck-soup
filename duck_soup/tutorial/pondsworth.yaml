# Generated by scripts/build_tutorial.py — every example from the tutorials.
# Get it with `duck-soup tutorial`, then from that folder: duck-soup run pipelines/pondsworth.yaml
name: pondsworth_tutorial
description: "Every example from the duck soup tutorials, one pipeline (and layer) each."
output: output/pondsworth_tutorial.gpkg
overwrite: true
pipelines:
- name: spatial_join
  working_crs: EPSG:32631
  sources:
  - id: places
    format: geojson
    uri: data/tutorial/places.geojson
    crs: EPSG:4326
  - id: districts
    format: geojson
    uri: data/tutorial/districts.geojson
    crs: EPSG:4326
  - id: parks
    format: geojson
    uri: data/tutorial/parks.geojson
    crs: EPSG:4326
  - id: river
    format: geojson
    uri: data/tutorial/river.geojson
    crs: EPSG:4326
  - id: stops
    format: geojson
    uri: data/tutorial/stops.geojson
    crs: EPSG:4326
  - id: new_places
    format: geojson
    uri: data/tutorial/new_places.geojson
    crs: EPSG:4326
  - id: paths
    format: geojson
    uri: data/tutorial/paths.geojson
    crs: EPSG:4326
  - id: lit_paths
    format: geojson
    uri: data/tutorial/lit_paths.geojson
    crs: EPSG:4326
  - id: boardwalks
    format: geojson
    uri: data/tutorial/boardwalks.geojson
    crs: EPSG:4326
  - {id: categories, format: csv, uri: data/tutorial/categories.csv}
  base: places
  steps:
  - type: spatial_join
    source: districts
    predicate: intersects
    fields: {district: district_name}
  mapping: []
  layers:
  - {layer: spatial_join, crs: 'EPSG:32631'}
