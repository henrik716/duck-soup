  - {type: filter, branch: crumb_hotspots, where: "bread_crumbs >= 50000"}
  - {type: buffer, branch: crumb_hotspots, distance: 250}
  - type: spatial_join
    source: crumb_hotspots
    predicate: within
    match: all
    fields: {near_hotspot: name}
  - {type: filter, where: "near_hotspot IS NULL OR near_hotspot <> name"}
  mapping: []
  layers:
  - {layer: snapshot, crs: 'EPSG:32631'}
- name: map_basic
  working_crs: EPSG:32631
  sources:
  - id: places
    format: geojson
    uri: data/tutorial/places.geojson
    crs: EPSG:4326
  - id: districts
    format: geojson
    uri: data/tutorial/districts.geojson
    crs: EPSG:4326
