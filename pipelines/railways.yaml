- name: RailwayStations
  description: ''
  sources:
  - id: stasjoner_idrift
    format: gpkg
    uri: data/Stasjoner_iDrift.gpkg
    layer: Stasjoner_iDrift
    crs: EPSG:25833
    make_valid: true
    where: 1=1
    page_size: 2000
  derived_sources: []
  base: stasjoner_idrift
  steps: []
  mapping:
  - to: dgif_fullName
    from: navn
  - to: trackId
    from: sporkilometer
    cast: DOUBLE
  - to: railwayLineName
    from: banenavn
  - to: railwayLineShortCode
    from: banekortnavn
  - to: stationType
    codelist:
      source: stasjonstype
      case_insensitive: true
      cases:
      - value: signalEquipped
        match: Signalteknisk
      - value: nonSignalEquipped
        match: Ikke-signalteknisk
      default: noInformation
  - to: dgif_meansTransportation
    const: train
    cast: VARCHAR
  - to: dgif_transportationUse
    codelist:
      source: jernbaneformål
      case_insensitive: true
      cases:
      - value: passenger
        match: Persontrafikk
      - value: cargo
        match: Godstrafikk
      - value: general
        match: Blandet trafikk
      - value: noInformation
        match: Kryssing
      default: noInformation
  - to: dgif_facilityOperationalStatus
    codelist:
      source: jernbanestatus
      case_insensitive: true
      cases:
      - value: operational
        match: I drift
      - value: nonOperational
        match: Nedlagt
      - value: temporarilyNonOperational
        match: Midlertidig ute av drift
      default: noInformation
  - to: dgif_currencyDateTime
    from: gyldigfra
    cast: TIMESTAMP
  - to: dgif_modificationDate
    const: 01.01.1111
    cast: TIMESTAMP
