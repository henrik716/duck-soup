  - to: dgif_sourceIdentifier
    const: BaneNOR
    cast: VARCHAR
  - to: classification
    const: NATO UNCLASSIFIED
    cast: VARCHAR
  - to: gradering
    const: Ugradert
    cast: VARCHAR
  - to: opphav
    const: BaneNOR
    cast: VARCHAR
  - to: dgif_featureType
    const: noInformation
  - to: dgif_featureType531
    const: noInformation
  - to: uuid
    func: uuid
  layers:
  - layer: RailwaySwitch
    crs: EPSG:25833
    mapping: []
