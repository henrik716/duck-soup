- name: RailwaySwitches
  description: ''
  sources:
  - id: sporveksel
    format: gpkg
    uri: data/Sporveksel.gpkg
    layer: Sporveksel
    crs: EPSG:25833
    make_valid: true
    where: 1=1
    page_size: 2000
  derived_sources: []
  base: sporveksel
  steps: []
  mapping:
  - to: objectId
    from: objekt
  - to: dgif_fullName
    from: navn
  - to: switchType
    codelist:
      source: vekseltype
      case_insensitive: true
      cases:
      - value: simpleSwitch
        match: Enkel veksel
      - value: doubleSlipSwitch
        match: Dobbel kryssveksel
      - value: diamondCrossing
        match: Sporkryss
      - value: asymmetricDoubleSwitch
        match: Usym.dobbeltveksel
      - value: singleSlipSwitch
        match: Enkel kryssveksel
      - value: doubleDerailer
        match: Dobbel avsporingstunge
      default: noInformation
  - to: description
    from: beskrivelse
  - to: dgif_currencyDateTime
    const: 01.01.1111
    cast: TIMESTAMP
  - to: dgif_modificationDate
    const: 01.01.1111
    cast: TIMESTAMP
  - to: dataWithdrawalDate
    func: now
    cast: DATE
  - to: lat
    func: lat
  - to: lon
    func: lon
  - to: mgrs
