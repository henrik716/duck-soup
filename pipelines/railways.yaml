    cast: VARCHAR
  - to: gradering
    const: Ugradert
    cast: VARCHAR
  - to: opphav
    const: BaneNOR
    cast: VARCHAR
  - to: dgif_featureType
    const: TransportationStation
  - to: dgif_featureType531
    const: AQ125
  - to: uuid
    func: uuid
  layers:
  - layer: RailwayStation
    crs: EPSG:25833
    mapping: []
