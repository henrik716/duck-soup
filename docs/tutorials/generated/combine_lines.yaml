base: paths
steps:
- type: line_overlay
  source: lit_paths
  fields: {lamps: lamps}
  tolerance: 0.1
- type: line_overlay
  source: boardwalks
  fields: {material: material}
  tolerance: 0.1
- type: combine_lines
  by:
  - name
  - lamps
  aggregates:
  - {to: pieces, how: count}
  - {to: materials, from: material, how: all}
